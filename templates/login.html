{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">DISPATCH ACCESS</span>
  <h1>Welcome back</h1>
  <p class="subhead">Log in to manage your support queue.</p>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="POST" class="ticket-form">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('views.forgot_password') }}">Forgot password?</a> · <a href="{{ url_for('views.signup') }}">Create an account</a></p>
</section>
{% endblock %}
