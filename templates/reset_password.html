{% extends "base.html" %}
{% block title %}Choose new password{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Choose a new password</h1>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="POST" class="ticket-form">
    <div class="form-row"><label for="token">Reset token</label><input id="token" name="token" value="{{ token }}" required></div>
    <div class="form-row"><label for="password">New password <span class="hint">8+ characters</span></label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn-primary btn-block" type="submit">Reset password</button>
  </form>
</section>
{% endblock %}
